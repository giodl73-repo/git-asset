name: Qualify trusted trigger
on:
  push:
    branches: [feat/github-trigger, feat/source-settlement]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: qualify-trigger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  issuer-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt
      - name: Build fixture receiver
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'git-asset-build'
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          cargo build -p git-asset --features github --bin git-asset-trigger --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p git-asset --features github --test github_real --locked --no-run
          exit $LASTEXITCODE
      - name: Qualify live issuer against fresh no-payload fixture
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_ASSET_REAL_REPOSITORY: ${{ github.repository }}
          GIT_ASSET_REAL_REPOSITORY_ID: ${{ github.repository_id }}
          GIT_ASSET_REAL_OWNER_ID: ${{ github.repository_owner_id }}
          GIT_ASSET_REAL_REF: ${{ github.ref }}
          GIT_ASSET_REAL_WORKFLOW_REF: ${{ github.workflow_ref }}
          GIT_ASSET_REAL_EVENT: ${{ github.event_name }}
          GIT_ASSET_REAL_AUDIENCE: git-asset:hosted-qualification
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'git-asset-build'
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          try {
            $separator = if ($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')) { '&' } else { '?' }
            $uri = $env:ACTIONS_ID_TOKEN_REQUEST_URL + $separator + 'audience=' + [Uri]::EscapeDataString($env:GIT_ASSET_REAL_AUDIENCE)
            $response = Invoke-RestMethod -Uri $uri -Headers @{Authorization=('Bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)}
            $env:GIT_ASSET_REAL_GITHUB_OIDC = $response.value
          } catch {
            Write-Error 'OIDC fixture admission unavailable'
            exit 1
          }
          cargo test -p git-asset --features github --test github_real --locked actual_hosted_oidc_reaches_foreground_receiver_without_payloads -- --ignored --exact --nocapture
          $result = $LASTEXITCODE
          Remove-Item Env:GIT_ASSET_REAL_GITHUB_OIDC
          exit $result
  windows-native-copy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Qualify authenticated loopback copy with pinned Git-annex
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hash = '6fd4dacc072476df20c79ae270418c40d5d2502bff31b4f017b4ceb52a2e7f9c'
          $root = Join-Path $env:RUNNER_TEMP 'git-asset-native-copy'
          New-Item -ItemType Directory -Path $root | Out-Null
          $installer = Join-Path $root 'git-annex-installer.exe'
          $url = "https://archive.org/download/git-annex-builds/SHA256E-s38971822--$hash.exe"
          curl.exe --fail --location --silent --show-error --max-time 180 --output $installer $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item -LiteralPath $installer).Length -ne 38971822 -or
              (Get-FileHash -LiteralPath $installer).Hash -ne $hash) {
            throw 'The Windows Git-annex 10.20261113 installer does not match the pin'
          }
          $runtime = Join-Path $root 'runtime'
          $extractor = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          & $extractor x $installer "-o$runtime" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $git = Get-Command git.exe -CommandType Application | Select-Object -First 1
          $gitBin = Split-Path -Parent $git.Source
          $gitUsr = Join-Path (Split-Path -Parent $gitBin) 'usr\bin'
          $annexBin = Join-Path $runtime 'usr\bin'
          $env:GIT_ASSET_TEST_GIT_EXE = $git.Source
          $env:GIT_ASSET_TEST_ANNEX_EXE = Join-Path $annexBin 'git-annex.exe'
          $env:GIT_ASSET_TEST_ANNEX_PATH = "$annexBin;$gitBin;$gitUsr"
          $env:CARGO_TARGET_DIR = Join-Path $root 'build'
          $env:TEMP = $root
          $env:TMP = $root
          cargo test --locked -p git-asset --all-features --lib actual_authenticated_native_copy_reopens_original_after_head_advance -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            $separator = if ($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains('?')) { '&' } else { '?' }
            $uri = $env:ACTIONS_ID_TOKEN_REQUEST_URL + $separator + 'audience=' + [Uri]::EscapeDataString('git-asset:hosted-native-copy')
            $response = Invoke-RestMethod -Uri $uri -Headers @{Authorization=('Bearer ' + $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)}
            $env:GIT_ASSET_REAL_GITHUB_OIDC = $response.value
          } catch {
            Write-Error 'OIDC fixture admission unavailable'
            exit 1
          }
          try {
            cargo test --locked -p git-asset --all-features --lib actual_hosted_oidc_copies_committed_native_fixture -- --ignored --nocapture
            $result = $LASTEXITCODE
          } finally {
            Remove-Item Env:GIT_ASSET_REAL_GITHUB_OIDC
          }
          exit $result

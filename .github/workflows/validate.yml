name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          curl --fail --location --silent --show-error --output "$scan_dir/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' > "$scan_dir/SHA256SUMS"
          (cd "$scan_dir" && sha256sum --check SHA256SUMS && tar -xzf gitleaks.tar.gz)
          "$scan_dir/gitleaks" git . --redact --log-opts=--all
  scope:
    runs-on: ubuntu-latest
    outputs:
      readme_only: ${{ steps.scope.outputs.readme_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.x'
      - id: scope
        run: python -B tools/ci_scope.py
  verify:
    needs: scope
    if: needs.scope.outputs.readme_only != 'true'
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_TEST_THREADS: '4'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        suite: [workspace, store, journal, continuation, rotations, operator, compat]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Validate foundation
        if: matrix.suite == 'workspace'
        shell: pwsh
        run: ./tools/validate.ps1
      - name: Check source naming and both immutable input identities
        if: matrix.suite == 'workspace'
        run: |
          python -B tools/check_branding.py
          python -B tools/check_branding.py --baseline 66f8b4b5f941e988815aa1ce7e635196574f6704
      - name: Check README-only classifier
        if: matrix.suite == 'workspace'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: python -B tools/test_ci_scope.py
      - name: Check explicit restore orchestration paths
        if: matrix.suite == 'workspace'
        run: python -B tools/test_restore_project.py
      - name: Check catalogue collection interactions
        if: matrix.suite == 'workspace'
        run: node --test crates/git-asset/tests/work-selection.cjs crates/git-asset/tests/impact.cjs crates/git-asset/tests/ux-flows.cjs crates/git-asset/tests/compare-flows.cjs crates/git-asset/tests/object-flows.cjs crates/git-asset/tests/lessons-flows.cjs
      - name: Check opt-in GitHub request client
        if: matrix.suite == 'workspace'
        run: node --test examples/github/request.test.mjs
      - name: Configure isolated Rust temporary paths
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'git-asset-build')" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMPDIR=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          git --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git lfs version
          exit $LASTEXITCODE
      - name: Check library test partition
        if: matrix.suite == 'workspace'
        run: python -B tools/test_ci_store_shards.py
      - name: Workspace format, non-store tests, store integration and documentation
        if: matrix.suite == 'workspace'
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --workspace --all-features --bins --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $agedCase = 'retirement_cases::paged_cases::native_seventeen_root_age_block_executes_paged_claims_and_only_eligible_copy_loss'
          $caseList = & cargo test -p git-asset --all-features --test native_source --locked -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($caseList | Where-Object { $_ -eq "$($agedCase): test" }).Count -ne 1) { throw 'Required isolated case must exist exactly once' }
          cargo test -p git-asset --all-features --test native_source --locked $agedCase -- --exact --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --exclude git-asset-store --all-features --locked -- --skip $agedCase
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p git-asset-store --test '*' --all-features --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p git-asset-store --bins --all-features --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p git-asset-store --doc --all-features --locked
          exit $LASTEXITCODE
      - name: Store library exact inventory shard
        if: contains(fromJSON('["store", "journal", "continuation", "rotations"]'), matrix.suite)
        run: python -B tools/run_ci_store_shard.py ${{ matrix.suite }}
      - name: Explicit CLI operator qualifications
        if: matrix.suite == 'operator'
        shell: pwsh
        run: |
          cargo build --workspace --all-features --bins --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:GIT_ASSET_RETIREMENT_CLI = Join-Path $env:CARGO_TARGET_DIR "debug/git-asset-storage$suffix"
          cargo test -p git-asset-store --lib --locked retirement::tests::explicit_cli_pending_cancellation_qualification -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GIT_ASSET_BULK_CLI = $env:GIT_ASSET_RETIREMENT_CLI
          cargo test -p git-asset-store --lib --locked final_retirement::bulk::tests::explicit_cli_bulk_inspection_qualification -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p git-asset-store --lib --locked final_retirement::bulk::tests::operator::explicit_cli_bulk_execution_qualification -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GIT_ASSET_PAGED_CLI = $env:GIT_ASSET_RETIREMENT_CLI
          cargo test -p git-asset-store --lib --locked final_retirement::bulk::tests::paged::operator::explicit_cli_paged_operator_qualification -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p git-asset-store --lib --locked final_retirement::bulk::tests::paged::operator::explicit_cli_aged_paged_operator_qualification -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GIT_ASSET_FOLLOWUP_CLI = $env:GIT_ASSET_RETIREMENT_CLI
          cargo test -p git-asset-store --lib --locked final_retirement::bulk::tests::paged::followup::operator::explicit_cli_held_copy_followup_qualification -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p git-asset --features schema --test native_source --locked retirement_cases::paged_cases::operator::native_cli_selection_reaches_storage_operator_and_preserves_shared_bytes -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict workspace Clippy and standalone Git check
        if: matrix.suite == 'workspace'
        shell: pwsh
        run: |
          cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check -p git-asset --no-default-features --locked
          exit $LASTEXITCODE
      - name: Qualify pre-final provider writer refusal
        if: matrix.suite == 'compat'
        shell: pwsh
        run: |
          $baseline = '273e639cd9515f0860140c926240b18e4ca69a1b'
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'git-asset-pre-final'
          $baselineBuild = Join-Path $env:RUNNER_TEMP 'git-asset-pre-final-build'
          $env:GIT_LFS_SKIP_SMUDGE = '1'
          git -c core.hooksPath=NUL fetch --no-tags --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -c core.hooksPath=NUL worktree add --detach $baselineRoot $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          cargo build --manifest-path "$baselineRoot/crates/tig-store/Cargo.toml" --target-dir $baselineBuild --bin tig-storage --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:GIT_ASSET_PRE_FINAL_CLI = Join-Path $baselineBuild "debug/tig-storage$suffix"
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'git-asset-build'
          cargo test -p git-asset-store --test retirement_cli --locked pre_final_writer_refuses_new_manifest_and_accepts_legacy_control -- --ignored --exact
          exit $LASTEXITCODE
      - name: Qualify pre-pair source reader compatibility
        if: matrix.suite == 'compat'
        shell: pwsh
        run: |
          $baseline = 'd81cabe662e0efb976f9ac1c230a1de2ace8e23f'
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'git-asset-source-baseline'
          $baselineBuild = Join-Path $env:RUNNER_TEMP 'git-asset-source-baseline-build'
          $env:GIT_LFS_SKIP_SMUDGE = '1'
          git -c core.hooksPath=NUL fetch --no-tags --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -c core.hooksPath=NUL worktree add --detach $baselineRoot $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          cargo build --manifest-path "$baselineRoot/crates/tig-store/Cargo.toml" --target-dir $baselineBuild --bin tig-source --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $env:GIT_ASSET_BASELINE_SOURCE_CLI = Join-Path $baselineBuild "debug/tig-source$suffix"
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'git-asset-build'
          cargo test -p git-asset-store --lib --locked source_claims::admission::tests::baseline_cli_replays_atomic_pairs_without_format_migration -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p git-asset-store --lib --locked source_claims::subset::tests::baseline_reader_preserves_subset_states_and_retirement_receipt -- --ignored --exact
          exit $LASTEXITCODE
  foundation:
    # Existing protected status names aggregate every Rust shard, or the proven README fast path.
    needs: [scope, verify]
    if: always()
    timeout-minutes: 10
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require qualification for the declared scope
        shell: pwsh
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          README_ONLY: ${{ needs.scope.outputs.readme_only }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if ($env:SCOPE_RESULT -ne 'success') { throw 'Scope classification did not succeed' }
          if ($env:README_ONLY -eq 'true') {
            if ($env:VERIFY_RESULT -ne 'skipped') { throw 'Unexpected README verification result' }
          } elseif ($env:VERIFY_RESULT -ne 'success') {
            throw "Native verification did not succeed: $env:VERIFY_RESULT"
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.scope.outputs.readme_only == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: needs.scope.outputs.readme_only == 'true'
        with:
          python-version: '3.x'
      - name: Validate README documentation and source boundaries
        if: needs.scope.outputs.readme_only == 'true'
        shell: pwsh
        run: |
          ./tools/validate.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/check_branding.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/test_restore_project.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/test_ci_scope.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test crates/git-asset/tests/work-selection.cjs crates/git-asset/tests/impact.cjs crates/git-asset/tests/ux-flows.cjs crates/git-asset/tests/compare-flows.cjs crates/git-asset/tests/object-flows.cjs crates/git-asset/tests/lessons-flows.cjs examples/github/request.test.mjs
          exit $LASTEXITCODE
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

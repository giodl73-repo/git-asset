# Inert consumer example. Copy request.mjs to tools/git-asset-request.mjs and this file
# to .github/workflows/git-asset-placement.yml only after independent enrollment.
name: git-asset placement
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: git-asset-placement-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: tools/git-asset-request.mjs
      - name: Request enrolled placement reconciliation
        env:
          GIT_ASSET_ENDPOINT: ${{ vars.GIT_ASSET_ENDPOINT }}
          GIT_ASSET_AUDIENCE: ${{ vars.GIT_ASSET_AUDIENCE }}
        run: node tools/git-asset-request.mjs
